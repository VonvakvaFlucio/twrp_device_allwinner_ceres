name: Build TWRP for Allwinner ML_SO0R_M7_WIFI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Manifest (Shallow Sync)
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@action.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags -v

      - name: Inject Device Tree
        run: |
          mkdir -p workspace/device/allwinner/
          cp -r device/allwinner/ML_SO0R_M7_WIFI workspace/device/allwinner/

      - name: Start Compilation
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_ML_SO0R_M7_WIFI-eng
          mka bootimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-allwinner-boot
          path: workspace/out/target/product/ML_SO0R_M7_WIFI/boot.img
